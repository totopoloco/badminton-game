# Builds the web version with Godot and publishes it on GitHub Pages, and on
# itch.io when that is set up.
# One-time setup on GitHub: Settings > Pages > Build and deployment > Source: GitHub Actions.
# For itch.io (optional): Settings > Secrets and variables > Actions, a secret
# ITCH_IO_SECRET (an itch.io API key) and a variable ITCH_GAME (the page's
# user/project, e.g. yourname/badminton). Without ITCH_GAME the itch job is skipped.
name: Web build to GitHub Pages and itch.io

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot and its web template
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot and its web template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot "$RUNNER_TEMP/dl"
          curl -fsSL -o "$RUNNER_TEMP/dl/godot.zip" "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/dl/godot.zip" -d ~/godot
          curl -fsSL -o "$RUNNER_TEMP/dl/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # Only the single-threaded web template is needed; the full set is 1.3 GB.
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tpl"
          unzip -q -j "$RUNNER_TEMP/dl/templates.tpz" templates/version.txt templates/web_nothreads_release.zip -d "$tpl"
          ls -la ~/godot "$tpl"

      - name: Export the web build
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          out="$RUNNER_TEMP/web"
          mkdir -p "$out"
          "$godot" --headless --path . --import
          "$godot" --headless --path . --export-release "Web" "$out/index.html"
          "$godot" --headless --path . -- --licenses="$out/GODOT_LICENSES.txt"
          for f in index.html index.wasm index.pck GODOT_LICENSES.txt; do test -s "$out/$f"; done
          ls -la "$out"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  itch:
    needs: build
    if: vars.ITCH_GAME != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get the web build
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact

      - name: Push it to itch.io with butler
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_IO_SECRET }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::Missing secret ITCH_IO_SECRET (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          web="$RUNNER_TEMP/web"
          mkdir -p "$web" "$RUNNER_TEMP/butler"
          tar -xf "$RUNNER_TEMP/artifact/artifact.tar" -C "$web"
          for f in index.html index.wasm index.pck; do test -s "$web/$f"; done
          curl -fsSL -o "$RUNNER_TEMP/butler.zip" https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          butler="$RUNNER_TEMP/butler/butler"
          chmod +x "$butler"
          "$butler" version
          # html5 channel; the upload is marked "played in the browser" once on itch.io
          "$butler" push "$web" "$ITCH_GAME:html5" --userversion "${GITHUB_SHA::7}" --if-changed
